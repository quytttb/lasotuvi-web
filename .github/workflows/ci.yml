name: CI

on:
  push:
    branches: [main, master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # Node 24–native action runtimes (avoid Node 20 deprecation warnings).
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        # Version comes from package.json "packageManager" (do not also set version here).

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Format
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit & component tests
        run: pnpm test

      - name: Production build
        run: pnpm build
        env:
          NEXT_PUBLIC_LASOTUVI_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: E2E (mocked API)
        run: pnpm test:e2e e2e/mvp.spec.ts --project=chromium --project=mobile
        env:
          NEXT_PUBLIC_LASOTUVI_API_URL: http://localhost:8000
          NEXT_PUBLIC_SITE_URL: http://localhost:3000
          CI: true
